{% extends 'base.html' %}
{% block title %}Contact Sales{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="mb-2">Contact Sales</h4>
        <p class="text-muted mb-4">Tell us about your needs and our team will reach out with a tailored proposal.</p>
        <form method="post" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name *</label>
              <input type="text" name="full_name" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Organization *</label>
              <input type="text" name="organization" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Email *</label>
              <input type="email" name="email" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="text" name="phone" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Industry</label>
              <input type="text" name="industry" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Number of Users Needed</label>
              <input type="number" name="users_needed" min="1" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Query Category *</label>
              <select name="category" class="form-select" required>
                {% for c in categories %}
                <option value="{{ c }}">{{ c }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Message *</label>
              <textarea name="message" rows="4" class="form-control" required></textarea>
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mt-3">
            <small class="text-muted">We respond within one business day.</small>
            <button type="submit" class="btn btn-primary">Submit</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
