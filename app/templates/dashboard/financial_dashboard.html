{% extends 'base.html' %}
{% block content %}
<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h2 class="mb-1">Financial Impact</h2>
      <p class="text-muted mb-0">Revenue loss, downtime cost, risk exposure</p>
    </div>
    <div class="text-muted" id="fin-last-updated">--</div>
  </div>

  <div class="row g-3">
    <div class="col-lg-4">
      <div class="card h-100">
        <div class="card-header">Risk Exposure</div>
        <div class="card-body">
          <h3 class="mb-2" id="fin-risk">--</h3>
          <p class="text-muted mb-0">Total risk exposure</p>
        </div>
      </div>
    </div>
    <div class="col-lg-8">
      <div class="card h-100">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Cost Projection</span>
          <div class="d-flex align-items-center gap-2">
            <label class="text-muted small mb-0">Machine ID</label>
            <input type="number" id="fin-machine-id" class="form-control form-control-sm" placeholder="Machine ID">
            <button class="btn btn-sm btn-primary" id="fin-refresh">Run</button>
          </div>
        </div>
        <div class="card-body">
          <canvas id="fin-chart" height="240"></canvas>
          <div class="mt-3" id="fin-summary"></div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>window.ACCESS_TOKEN = "{{ access_token }}";</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/financial.js') }}"></script>
{% endblock %}
